name: Build and Push Gold

on:
  push:
    branches:
      - main
    paths:
      - 'gold/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: ./gold/go.sum

      - name: Cross-compile server binary
        working-directory: ./gold
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o main src/cmd/server/main.go

      - name: Cross-compile migrate binary
        working-directory: ./gold
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o migrate src/cmd/migrate/main.go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./gold
          file: ./gold/Dockerfile.ci
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}/gold:prod
          cache-from: type=gha,scope=gold
          cache-to: type=gha,mode=max,scope=gold

      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_GOLD_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
