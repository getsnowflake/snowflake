name: Build and Push Helium

on:
  push:
    branches:
      - main
    paths:
      - 'helium/**'
      - '.github/workflows/publish-helium.yml'
      - '!**/*.md'
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: publish-helium
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: ./helium/go.sum

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.1"

      - name: Install protoc plugins
        working-directory: ./helium
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0

      - name: Generate protobuf code
        working-directory: ./helium
        run: make generate

      # One invocation builds both commands in parallel with a shared cache.
      - name: Cross-compile binaries
        working-directory: ./helium
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/ ./src/cmd/server ./src/cmd/migrate
          mv bin/server main && mv bin/migrate migrate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./helium
          file: ./helium/Dockerfile.ci
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}/helium:prod

      - name: Deploy to Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_HELIUM_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
