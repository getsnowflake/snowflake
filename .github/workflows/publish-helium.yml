name: Build and Push Helium

on:
  push:
    branches:
      - main
    paths:
      - 'helium/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
          cache-dependency-path: ./helium/go.sum

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.1"

      - name: Install protoc plugins
        working-directory: ./helium
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0

      - name: Generate protobuf code
        working-directory: ./helium
        run: make generate

      - name: Cross-compile server binary
        working-directory: ./helium
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o main src/cmd/server/main.go

      - name: Cross-compile migrate binary
        working-directory: ./helium
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o migrate src/cmd/migrate/main.go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./helium
          file: ./helium/Dockerfile.ci
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}/helium:prod
          cache-from: type=gha,scope=helium
          cache-to: type=gha,mode=max,scope=helium

      - name: Deploy to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_HELIUM_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
